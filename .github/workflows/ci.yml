# Corre en el ThinkCentre del homelab, como el resto de la plataforma. La
# variable de repo `CI_RUNNER` es el interruptor de vuelta: borrarla manda los
# jobs a GitHub sin tocar una línea de código.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Fijada, no leída del pubspec: ahí hay un rango, y un CI que instala
          # "la última" cambia de compilador sin que nadie toque el repo.
          flutter-version: 3.47.2
          channel: stable
          # En el runner propio la caché ya está en disco; pedirla la sube y la
          # baja para nada.
          cache: ${{ !vars.CI_RUNNER }}

      - name: Dependencias
        run: flutter pub get

      - name: Formato
        run: dart format --set-exit-if-changed lib test

      - name: Análisis
        run: flutter analyze

      - name: Tests
        run: flutter test
